name: "Markhor Apple CI"

on:
  push:
    branches:
      - markhor-apple-dev
  workflow_dispatch:

jobs:
  simulator-builds:
    name: "iOS/iPadOS + tvOS simulators + iPad IPA"
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Allow Swift package macros and plugins in CI
        run: |
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES

      - name: Install build tools
        run: |
          brew list swiftgen >/dev/null 2>&1 || brew install swiftgen
          brew list swiftformat >/dev/null 2>&1 || brew install swiftformat
          brew list carthage >/dev/null 2>&1 || brew install carthage

      - name: Build Carthage dependencies
        run: carthage update --use-xcframeworks --cache-builds

      - name: Generate Markhor assets
        run: sh Scripts/Markhor/GenerateMarkhorAssets.sh

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Swiftfin.xcodeproj

      - name: Build iOS and tvOS simulators
        run: sh Scripts/Markhor/build-simulators.sh

      - name: Build unsigned iPadOS IPA
        run: sh Scripts/Markhor/build-ios-device-ipa.sh

      - name: Upload iPadOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Markhor-IPTV-iPadOS-unsigned
          path: artifacts/Markhor-IPTV-iPadOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Show working tree after build
        if: always()
        run: git status --short
